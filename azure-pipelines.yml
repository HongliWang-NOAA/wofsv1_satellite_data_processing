trigger:
- master

resources:
- repo: self

parameters:
- name: vargroup
  displayName: DevOps variable group
  type: string
  default: "wofs-pipeline-variables" 
- name: wofs_package_version
  displayName: Major/Minor Version
  type: string
  default: 2.0

variables:
- group: ${{ parameters.vargroup }}

stages:
- stage: Build
  displayName: Build and push stage
  jobs:  
  - job: Build
    displayName: Build
    pool:
      vmImage: $(DEFAULT_POOL_IMAGE)
      name: Azure Pipelines
    steps:
    - task: PipAuthenticate@1
      displayName: 'Pip Authenticate'
      inputs:
        artifactFeeds: 'Warn-on-Forecast/wofs-post'
        onlyAddExtraIndex: true

    - task: Docker@2
      displayName: 'Build docker image'
      inputs:
        containerRegistry: $(AZ_DEVOPS_ACR_SERVICE_CONNECTION_NAME)
        repository: 'wofs/SatelliteProcessing'
        command: build
        Dockerfile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest
        arguments: '--build-arg INDEX_URL=$(PIP_EXTRA_INDEX_URL)'

    - task: Docker@2
      displayName: Publish
      inputs:
        containerRegistry: $(AZ_DEVOPS_ACR_SERVICE_CONNECTION_NAME)
        repository: 'wofs/SatelliteProcessing'
        tags: |
          $(Build.BuildId)
          latest  
        command: push
